<script>
// --- CONFIG ---
const NOME_MESTRE = 'trickchefemestre';
const supabaseUrlBruta = 'https://utltpfihutfvmpwzyltr.supabase.co';
const supabaseKey = 'sb_publishable_-22W7RP6TjUS1NPEGpEYwg_1xcq5TOf';
const supabaseUrl = supabaseUrlBruta.trim().replace(/\/rest\/v1\/?$/i, '').replace(/\/+$/, '');
let db = null;
try { db = supabase.createClient(supabaseUrl, supabaseKey.trim()); } catch (e) { console.error(e); }

const STATUS = {
    nao_iniciada: { label: 'Não Iniciada', cor: '#eab308' },
    em_andamento: { label: 'Em Andamento', cor: '#16a34a' },
    em_pausa:     { label: 'Em Pausa',     cor: '#f97316' },
    terminada:    { label: 'Terminada',    cor: '#dc2626' }
};
const ATTR_LBL = { forca: 'FOR', intelecto: 'INT', presenca: 'PRE', agilidade: 'AGI' };
const ATTRS = [['forca','FOR'],['intelecto','INT'],['presenca','PRE'],['agilidade','AGI']];
const PERICIAS = [['acrobacia','Acrobacia','AGI'],['adestramento','Adestramento','PRE'],['artes','Artes','PRE'],['atletismo','Atletismo','FOR'],['atualidades','Atualidades','INT'],['ciencias','Ciências','INT'],['crime','Crime','AGI'],['diplomacia','Diplomacia','PRE'],['enganacao','Enganação','PRE'],['fortitude','Fortitude','FOR'],['furtividade','Furtividade','AGI'],['iniciativa','Iniciativa','AGI'],['intimidacao','Intimidação','PRE'],['intuicao','Intuição','PRE'],['investigacao','Investigação','INT'],['luta','Luta','FOR'],['medicina','Medicina','INT'],['ocultismo','Ocultismo','INT'],['percepcao','Percepção','PRE'],['pilotagem','Pilotagem','AGI'],['pontaria','Pontaria','AGI'],['profissao','Profissão','INT'],['reflexos','Reflexos','AGI'],['religiao','Religião','PRE'],['sobrevivencia','Sobrevivência','INT'],['taticas','Táticas','INT'],['tecnologia','Tecnologia','INT'],['vontade','Vontade','PRE']];

let usuario = null, ehMestre = false, campanhas = [], fichas = [], timer = null;
let ultimoRolId = 0, ultAtualizado = null, timer2 = null, sondando = false;
let ultimaRolagem = {}, canal = null, fichaAberta = null, renderPendente = false, tp = null;

// --- HELPERS ---
const ELEMENTOS = {
    sangue: { n: 'Sangue', c: '#dc2626', t: '#fff' },
    morte: { n: 'Morte', c: '#000', t: '#fff', b: '#fff' },
    energia: { n: 'Energia', c: '#9333ea', t: '#fff' },
    conhecimento: { n: 'Conhecimento', c: '#eab308', t: '#fff' },
    medo: { n: 'Medo', c: '#fff', t: '#000' },
    contemplacao: { n: 'Contemplação', c: '#b8530f', t: '#fff' }
};
const fmt = n => Math.round((Number(n) || 0) * 100) / 100;
const tituloEl = (nome, e) => `<span class="tf font-bold" style="${!e ? '' : e.b ? 'color:#fff' : 'color:' + e.c}">${esc(nome) || '(sem nome)'}</span>`;
const tagEl = e => e ? `<span class="tf text-[10px] font-bold px-2 rounded uppercase" style="background:${e.c};color:${e.t};${e.b ? 'border:1px solid ' + e.b + ';' : ''}text-shadow:0 1px 1px rgba(0,0,0,.6)">${e.n}</span>` : '';
const chip = t => `<span class="tf text-[10px] px-1 rounded bg-[#333] text-gray-300">${t}</span>`;
const desc = t => t ? `<p class="text-xs text-gray-400 mt-1 whitespace-pre-wrap">${esc(t)}</p>` : '';
const bloco = (e, cab, corpo) => `<div class="bg-[#161616] rounded p-2 mb-2 border border-gray-800" style="border-left:3px solid ${e ? (e.b || e.c) : '#555'}"><div class="flex items-center flex-wrap gap-2">${cab}</div>${corpo}</div>`;
const titSec = t => `<h4 class="tf text-lg mt-4 mb-2 border-b border-gray-700">${t}</h4>`;
const vazio = '<p class="text-gray-500">—</p>';

function secPoderes(t, arr) {
    return titSec(t) + ((arr || []).map(p => {
        const o = typeof p === 'string' ? { nome: p } : p, e = ELEMENTOS[o.elemento];
        return bloco(e, tituloEl(o.nome, e) + tagEl(e), desc(o.descricao));
    }).join('') || vazio);
}

function secRituais(arr) {
    return titSec('RITUAIS') + ((arr || []).map(r => {
        const e = ELEMENTOS[r.elemento];
        const campos = [['Alcance', r.alcance], ['Execução', r.execucao], ['Duração', r.duracao], ['Alvo', r.alvo], ['Efeito', r.efeito], ['Área', r.area], ['Resistência', r.resistencia]]
            .filter(([, v]) => v).map(([k, v]) => `<div><span class="text-gray-500">${k}:</span> ${esc(v)}</div>`).join('');
        return bloco(e, tituloEl(r.nome, e) + chip((r.circulo || 1) + 'º') + tagEl(e), `<div class="text-xs mt-1 grid grid-cols-2 gap-x-4">${campos}</div>` + desc(r.descricao));
    }).join('') || vazio);
}

function secInventario(f) {
    const itens = (f.itens || []).map(x => typeof x === 'string' ? { nome: x } : x);
    const total = itens.reduce((t, i) => t + (Number(i.peso) || 0) * (i.qtd ?? 1), 0);
    const max = Number(f.peso_max) || 0;
    const cor = max > 0 && total > max ? '#ff7a85' : '#e5e5e5';
    return titSec('INVENTÁRIO') + `<div class="tf mb-2">PESO: <b style="color:${cor}">${fmt(total)}</b> / ${fmt(max)}</div>` +
        (itens.map(i => bloco(null, tituloEl(i.nome), `<div class="text-xs text-gray-500 mt-1">Categoria ${esc(i.categoria || 'I')} · Qtd ${fmt(i.qtd ?? 1)} · Peso ${fmt(i.peso)}</div>` + desc(i.descricao))).join('') || vazio);
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = t => (t || '').trim().toLowerCase();
function setCookie(n, v, d = 365) { document.cookie = `${n}=${encodeURIComponent(v)}; max-age=${d * 86400}; path=/; SameSite=Lax`; }
function getCookie(n) { const i = document.cookie.split('; ').find(c => c.startsWith(n + '=')); return i ? decodeURIComponent(i.split('=').slice(1).join('=')) : null; }
function setStatus(msg, tipo = 'info') {
    const cores = { info: 'text-gray-400', ok: 'text-green-500', erro: 'text-red-500' };
    $('status').textContent = msg;
    $('status').className = 'text-xs ' + cores[tipo];
}
function abrirModal(h) { $('modal-body').innerHTML = h; $('modal').classList.remove('hidden'); $('modal').classList.add('flex'); }
function fecharModal() { fichaAberta = null; $('modal').classList.add('hidden'); $('modal').classList.remove('flex'); }
const modalAberto = () => !$('modal').classList.contains('hidden');
const msg = t => { $('conteudo').innerHTML = `<p class="text-gray-400 text-center text-lg mt-10">${t}</p>`; };

const barra = (l, a, m, cor) => {
    const p = m > 0 ? Math.max(0, Math.min(100, a / m * 100)) : 0;
    return `<div class="mb-2"><div class="flex justify-between tf"><span style="color:${cor}">${l}</span><span>${a} / ${m}</span></div><div class="h-2 bg-[#333] rounded"><div class="h-2 rounded" style="width:${p}%;background:${cor}"></div></div></div>`;
};
const badge = c => { const s = STATUS[c.status] || STATUS.nao_iniciada; return `<span class="tf font-bold px-3 py-1 rounded" style="color:${s.cor};border:1px solid ${s.cor}">${s.label}</span>`; };

// --- LOGIN / CARREGAMENTO ---
function entrar() {
    const u = norm($('user-name').value);
    if (!u) return setStatus('Digite um nome de usuário.', 'erro');
    usuario = u;
    setCookie('usuario', u);
    iniciar();
}

function iniciar() {
    ehMestre = usuario === NOME_MESTRE;
    clearInterval(timer);
    carregar();
    assinar();
    // Sondagem rápida: garante atualização mesmo se o Realtime não estiver entregando eventos
    clearInterval(timer2);
    timer2 = setInterval(() => {
        if (ehMestre) sondar();
        else if (document.activeElement.tagName !== 'SELECT') carregar(true);
    }, ehMestre ? 2000 : 5000);
    timer = setInterval(() => {
        if (modalAberto() || document.activeElement.tagName === 'SELECT') return;
        carregar(true);
    }, 30000); // fallback; o tempo real vem do Realtime
}

async function carregar(silencioso) {
    if (!db) return setStatus('Supabase não configurado.', 'erro');
    if (!usuario) return;
    if (!silencioso) setStatus('Carregando...');
    try {
        if (ehMestre) await carregarMestre(); else await carregarJogador();
        setStatus((ehMestre ? 'Modo mestre · ' : '') + 'atualizado às ' + new Date().toLocaleTimeString('pt-BR'), 'ok');
    } catch (e) {
        console.error(e);
        setStatus('Erro: ' + e.message, 'erro');
    }
}

// --- JOGADOR: só vê PV/PD dos aliados da própria campanha ---
async function carregarJogador() {
    const { data: eu, error } = await db.from('personagens').select('usuario,nome,campanha_id').eq('usuario', usuario).maybeSingle();
    if (error) throw error;
    if (!eu) return msg('Você ainda não tem personagem. Crie na sua ficha.');
    if (!eu.campanha_id) return msg('Seu personagem ainda não faz parte de nenhuma campanha.');

    const [c, a] = await Promise.all([
        db.from('campanhas').select('id,nome,status').eq('id', eu.campanha_id).maybeSingle(),
        db.from('personagens').select('usuario,nome,pv_atual,pv_max,pd_atual,pd_max').eq('campanha_id', eu.campanha_id).order('nome')
    ]);
    if (c.error) throw c.error;
    if (a.error) throw a.error;
    if (!c.data) return msg('Campanha não encontrada.');

    $('conteudo').innerHTML = `
        <div class="panel p-4 mb-6 flex flex-wrap items-center gap-3" style="border-left:4px solid ${(STATUS[c.data.status] || STATUS.nao_iniciada).cor}">
            <h2 class="tf text-2xl flex-grow">${esc(c.data.nome)}</h2>${badge(c.data)}
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        ${a.data.map(f => `<div class="panel p-3" ${f.usuario === usuario ? 'style="border-color:var(--accent)"' : ''}>
            <div class="tf text-xl font-bold truncate mb-2">${esc(f.nome)} ${f.usuario === usuario ? '<span class="text-xs text-gray-500">(você)</span>' : ''}</div>
            ${barra('PV', f.pv_atual, f.pv_max, '#ff7a85')}${barra('PD', f.pd_atual, f.pd_max, '#3b82f6')}
        </div>`).join('')}
        </div>`;
}

// --- MESTRE ---
async function carregarMestre() {
    const [c, f, r] = await Promise.all([
        db.from('campanhas').select('*').order('criado_em'),
        db.from('personagens').select('*').order('nome'),
        db.from('rolagens').select('*').order('criado_em', { ascending: false }).limit(300)
    ]);
    if (c.error) throw c.error;
    if (f.error) throw f.error;
    campanhas = c.data; fichas = f.data;
    ultAtualizado = fichas.reduce((m, x) => (!m || Date.parse(x.atualizado_em) > Date.parse(m)) ? x.atualizado_em : m, null);
    if (r.data && r.data[0]) ultimoRolId = Math.max(ultimoRolId, r.data[0].id);
    ultimaRolagem = {};
    (r.data || []).forEach(x => { if (!ultimaRolagem[x.usuario]) ultimaRolagem[x.usuario] = x; });
    fichas.forEach(x => { const h = (x.historico_rolagens || []).slice(-1)[0]; if (h && !ultimaRolagem[x.usuario]) ultimaRolagem[x.usuario] = h; });
    atualizarTela();
}

function renderMestre() {
    const livres = fichas.filter(x => !x.campanha_id);
    $('conteudo').innerHTML = `
        <div class="flex justify-between items-center mb-4">
            <h2 class="tf text-2xl">CAMPANHAS</h2>
            <button class="btn px-4 py-2 rounded font-bold" onclick="abrirNovaCampanha()"><i class="fas fa-plus mr-2"></i>NOVA CAMPANHA</button>
        </div>
        ${campanhas.map(cardCampanha).join('') || '<p class="text-gray-500 mb-6">Nenhuma campanha criada.</p>'}
        <h2 class="tf text-2xl mt-8 mb-4">FICHAS SEM CAMPANHA (${livres.length})</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${livres.map(x => cardFicha(x)).join('') || '<p class="text-gray-500">Nenhuma.</p>'}</div>`;
}

// --- TEMPO REAL ---
function atualizarTela() {
    if (document.activeElement && document.activeElement.tagName === 'SELECT') { renderPendente = true; return; }
    renderMestre();
    if (fichaAberta && modalAberto()) $('modal-body').innerHTML = htmlFicha(fichaAberta);
}
document.addEventListener('focusout', () => setTimeout(() => {
    if (renderPendente && document.activeElement.tagName !== 'SELECT') { renderPendente = false; atualizarTela(); }
}, 200));

const setLive = ok => { $('live').innerHTML = ok ? '<span class="text-green-500 ml-2">● AO VIVO</span>' : '<span class="text-yellow-500 ml-2">◐ atualizando a cada 2s</span>'; };
const mesclar = (lista, chave, novo) => { const i = lista.findIndex(x => x[chave] === novo[chave]); if (i >= 0) Object.assign(lista[i], novo); else lista.push(novo); };

function assinar() {
    if (!db) return;
    if (canal) { db.removeChannel(canal); canal = null; }
    let c = db.channel('painel-' + Date.now())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'personagens' }, onFicha)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'campanhas' }, onCampanha);
    if (ehMestre) c = c.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'rolagens' }, onRolagem);
    canal = c.subscribe((st, err) => { setLive(st === 'SUBSCRIBED'); if (st !== 'SUBSCRIBED') console.warn('Realtime:', st, err); });
}

function onFicha(p) {
    if (!ehMestre) { clearTimeout(tp); tp = setTimeout(() => carregar(true), 300); return; }
    if (p.eventType === 'DELETE') fichas = fichas.filter(f => f.usuario !== p.old.usuario);
    else if (!aplicarFicha(p.new)) return;
    atualizarTela();
}

function onCampanha(p) {
    if (!ehMestre) { clearTimeout(tp); tp = setTimeout(() => carregar(true), 300); return; }
    if (p.eventType === 'DELETE') campanhas = campanhas.filter(c => c.id !== p.old.id);
    else mesclar(campanhas, 'id', p.new);
    atualizarTela();
}

function mostrarRolagem(r) {
    ultimaRolagem[r.usuario] = r;
    document.querySelectorAll('[data-roll]').forEach(el => {
        if (el.dataset.roll !== r.usuario) return;
        el.innerHTML = conteudoRolagem(r);
        el.classList.remove('roll-pop'); void el.offsetWidth; el.classList.add('roll-pop');
    });
}

function novaRolagemDB(r) {
    if (r.id <= ultimoRolId) return;
    ultimoRolId = r.id;
    mostrarRolagem(r);
}

function onRolagem(p) { novaRolagemDB(p.new); }

// Aplica uma ficha vinda do banco (Realtime ou sondagem). Retorna true se algo mudou.
function aplicarFicha(x) {
    const ex = fichas.find(f => f.usuario === x.usuario);
    if (ex && x.atualizado_em && ex.atualizado_em === x.atualizado_em) return false;
    mesclar(fichas, 'usuario', x);
    fichas.sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
    // Se a tabela de rolagens não estiver disponível, usa o histórico salvo na ficha
    const h = (x.historico_rolagens || []).slice(-1)[0], u = ultimaRolagem[x.usuario];
    if (h && (!u || (Date.parse(h.data) > Date.parse(u.data || u.criado_em) && (u.nome !== h.nome || u.formula !== h.formula || u.total !== h.total))))
        mostrarRolagem({ ...h, usuario: x.usuario });
    if (x.atualizado_em && (!ultAtualizado || Date.parse(x.atualizado_em) > Date.parse(ultAtualizado))) ultAtualizado = x.atualizado_em;
    return true;
}

async function sondar() {
    if (sondando || !db || !usuario) return;
    sondando = true;
    try {
        let qf = db.from('personagens').select('*');
        if (ultAtualizado) qf = qf.gte('atualizado_em', ultAtualizado);
        const [f, c, r] = await Promise.all([qf, db.from('campanhas').select('*').order('criado_em'), db.from('rolagens').select('*').gt('id', ultimoRolId).order('id')]);
        let mudou = false;
        if (!f.error) (f.data || []).forEach(x => { if (aplicarFicha(x)) mudou = true; });
        if (!c.error && JSON.stringify(c.data) !== JSON.stringify(campanhas)) { campanhas = c.data; mudou = true; }
        if (!r.error) (r.data || []).forEach(novaRolagemDB);
        if (mudou) atualizarTela();
    } catch (e) { console.error(e); }
    sondando = false;
}

const conteudoRolagem = r => r
    ? `<span class="text-xs text-gray-400 truncate pr-2">${esc(r.nome)} <span class="text-gray-600">(${esc(r.formula)})</span></span><span class="flex flex-col items-end"><span class="roll-num ${r.detalhes && r.detalhes.critico ? 'crit-num' : ''} tf text-3xl font-bold" style="color:var(--accent)">${esc(r.total)}</span>${r.detalhes && r.detalhes.critico ? '<span class="tf text-[10px] font-bold tracking-widest" style="color:var(--accent)">CRÍTICO!</span>' : ''}</span>`
    : '<span class="text-xs text-gray-600">Sem rolagens</span>';
const rolagemBox = f => `<div data-roll="${esc(f.usuario)}" class="flex justify-between items-center bg-[#111] rounded p-2 my-2 min-h-[48px]">${conteudoRolagem(ultimaRolagem[f.usuario])}</div>`;

function cardCampanha(c) {
    const membros = fichas.filter(f => f.campanha_id === c.id);
    const s = STATUS[c.status] || STATUS.nao_iniciada;
    return `<div class="panel p-4 mb-6" style="border-left:4px solid ${s.cor}">
        <div class="flex flex-wrap items-center gap-3 mb-4">
            <h3 class="tf text-2xl flex-grow">${esc(c.nome)} <span class="text-sm text-gray-500">(${membros.length})</span></h3>
            <select onchange="mudarStatus('${c.id}', this.value)" class="tf font-bold px-2 py-1 rounded bg-[#111]" style="color:${s.cor};border:1px solid ${s.cor}">
                ${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === c.status ? 'selected' : ''} style="color:${v.cor}">${v.label}</option>`).join('')}
            </select>
            <button class="btn px-3 py-1 rounded" onclick="abrirAdicionar('${c.id}')"><i class="fas fa-user-plus mr-1"></i>FICHAS</button>
            <button class="btn px-3 py-1 rounded" onclick="apagarCampanha('${c.id}')"><i class="fas fa-trash mr-1"></i>APAGAR</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${membros.map(f => cardFicha(f, true)).join('') || '<p class="text-gray-500">Sem fichas.</p>'}</div>
    </div>`;
}

function cardFicha(f, naCampanha) {
    const a = f.atributos || {}, i = f.info || {};
    return `<div class="panel p-3">
        <div class="tf text-xl font-bold truncate">${esc(f.nome)}</div>
        <div class="text-xs text-gray-500 mb-2">@${esc(f.usuario)} · NÍVEL ${esc(f.nivel ?? '-')} · NEX ${esc(f.nex ?? 0)}%</div>
        ${barra('PV', f.pv_atual, f.pv_max, '#ff7a85')}${barra('PD', f.pd_atual, f.pd_max, '#3b82f6')}
        <div class="grid grid-cols-4 gap-1 text-center my-2">${ATTRS.map(([k, l]) => `<div class="bg-[#111] rounded p-1"><div class="text-[10px] text-gray-500">${l}</div><div class="tf">${esc(a[k] || '-')}</div></div>`).join('')}</div>
        ${rolagemBox(f)}
        <div class="text-xs text-gray-400 mb-2">DEFESA: <b class="text-white">${esc(i.defesa || '-')}</b> · DT RITUAIS: <b class="text-white">${esc(i.dt || '-')}</b> · PD/TURNO: <b class="text-white">${esc(f.pd_turno ?? '-')}</b></div>
        <div class="flex gap-2">
            <button class="btn px-2 py-1 rounded text-xs flex-grow" data-u="${esc(f.usuario)}" onclick="abrirFicha(this.dataset.u)">ABRIR FICHA</button>
            ${naCampanha ? `<button class="btn px-2 py-1 rounded text-xs" data-u="${esc(f.usuario)}" onclick="removerDaCampanha(this.dataset.u)"><i class="fas fa-user-minus"></i> REMOVER</button>` : ''}
        </div>
    </div>`;
}

// --- AÇÕES DO MESTRE ---
const listaChecks = l => l.length
    ? `<p class="tf text-gray-400 mb-2">SELECIONE AS FICHAS:</p><div class="max-h-72 overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-2">${l.map(f => `<label class="panel p-2 flex items-center gap-2 cursor-pointer"><input type="checkbox" class="chk" value="${esc(f.usuario)}"><span class="tf">${esc(f.nome)}</span><span class="text-xs text-gray-500">@${esc(f.usuario)}</span></label>`).join('')}</div>`
    : '<p class="text-gray-500">Não há fichas sem campanha.</p>';
const marcados = () => [...document.querySelectorAll('.chk:checked')].map(c => c.value);

function abrirNovaCampanha() {
    abrirModal(`<h3 class="tf text-2xl mb-4">NOVA CAMPANHA</h3>
        <input id="nc-nome" class="inp w-full text-lg mb-4" placeholder="Nome da campanha">
        ${listaChecks(fichas.filter(f => !f.campanha_id))}
        <div class="mt-4 text-right"><button class="btn px-5 py-2 rounded font-bold" onclick="criarCampanha()">CRIAR</button></div>`);
}

async function vincular(id, us) {
    if (!us.length) return;
    const { error } = await db.from('personagens').update({ campanha_id: id }).in('usuario', us);
    if (error) alert('Erro: ' + error.message);
}

async function criarCampanha() {
    const nome = $('nc-nome').value.trim();
    if (!nome) return alert('Dê um nome à campanha.');
    const { data, error } = await db.from('campanhas').insert({ nome }).select().single();
    if (error) return alert('Erro: ' + error.message);
    await vincular(data.id, marcados());
    fecharModal(); carregar();
}

function abrirAdicionar(id) {
    abrirModal(`<h3 class="tf text-2xl mb-4">ADICIONAR FICHAS</h3>${listaChecks(fichas.filter(f => !f.campanha_id))}
        <div class="mt-4 text-right"><button class="btn px-5 py-2 rounded font-bold" onclick="adicionarFichas('${id}')">ADICIONAR</button></div>`);
}

async function adicionarFichas(id) { await vincular(id, marcados()); fecharModal(); carregar(); }

async function removerDaCampanha(u) {
    const { error } = await db.from('personagens').update({ campanha_id: null }).eq('usuario', u);
    if (error) return alert('Erro: ' + error.message);
    carregar();
}

async function apagarCampanha(id) {
    if (!confirm('Apagar esta campanha? As fichas continuam existindo, só ficam sem campanha.')) return;
    const { error } = await db.from('campanhas').delete().eq('id', id);
    if (error) return alert('Erro: ' + error.message);
    carregar();
}

async function mudarStatus(id, s) {
    const { error } = await db.from('campanhas').update({ status: s }).eq('id', id);
    if (error) return alert('Erro: ' + error.message);
    carregar(true);
}

// --- FICHA DETALHADA (somente leitura) ---
function abrirFicha(u) { fichaAberta = u; abrirModal(htmlFicha(u)); }

function htmlFicha(u) {
    const f = fichas.find(x => x.usuario === u);
    if (!f) return '<p class="text-gray-500">Ficha não encontrada.</p>';
    const a = f.atributos || {}, i = f.info || {}, p = f.pericias || {}, bp = f.bonus_pericias || {};
    const camp = campanhas.find(c => c.id === f.campanha_id);
    const lista = (t, arr, cor) => `<h4 class="tf text-lg mt-4 mb-1 border-b border-gray-700" ${cor ? `style="color:${cor}"` : ''}>${t}</h4>${(arr || []).length ? `<ul class="list-disc pl-5">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="text-gray-500">—</p>'}`;
    const rolls = (f.rolagens_personalizadas || []).map(r => `${r.name ?? r.nome ?? ''} (${r.formula})`);
    const hist = (f.historico_rolagens || []).slice().reverse();

    return (`
        <h3 class="tf text-3xl font-bold">${esc(f.nome)}</h3>
        <div class="text-xs text-gray-500 mb-3">@${esc(f.usuario)} · Campanha: ${camp ? esc(camp.nome) : 'nenhuma'} · NÍVEL ${esc(f.nivel ?? '-')} · NEX ${esc(f.nex ?? 0)}%</div>
        <div class="grid md:grid-cols-2 gap-4">
            <div>${barra('PV', f.pv_atual, f.pv_max, '#ff7a85')}${barra('PD', f.pd_atual, f.pd_max, '#3b82f6')}</div>
            <div class="text-sm leading-relaxed">DEFESA: <b>${esc(i.defesa || '-')}</b> · PD/TURNO: <b>${esc(f.pd_turno ?? '-')}</b><br>DT RITUAIS: <b>${esc(i.dt || '-')}</b><br>TRILHA: <b class="uppercase">${esc(i.trilha || '-')}</b><br>OCUPAÇÃO: <b class="uppercase">${esc(i.ocupacao || '-')}</b><br>RESISTÊNCIAS: <b>${esc(f.resistencias || '-')}</b><br>PROFICIÊNCIAS: <b>${esc(f.proficiencias || '-')}</b></div>
        </div>
        <h4 class="tf text-lg mt-4 mb-1 border-b border-gray-700">ATRIBUTOS</h4>
        <div class="grid grid-cols-4 gap-2 text-center">${ATTRS.map(([k, l]) => `<div class="bg-[#111] rounded p-2"><div class="text-xs text-gray-500">${l}</div><div class="tf text-xl">${esc(a[k] || '-')}</div></div>`).join('')}</div>
        <h4 class="tf text-lg mt-4 mb-1 border-b border-gray-700">PERÍCIAS</h4>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-x-4 gap-y-1">${PERICIAS.map(([id, n, l]) => `<div class="flex justify-between"><span><span class="text-[10px] text-gray-500">${ATTR_LBL[(i.skillAttr || {})[id]] || l}</span> ${n}</span><b class="tf">${esc(p[id] || '1d4')}${bp[id] ? ` <span style="color:var(--accent)">${esc(/^[+-]/.test(bp[id]) ? bp[id] : '+' + bp[id])}</span>` : ''}</b></div>`).join('')}</div>
        ${secPoderes('PODERES', f.poderes)}
        ${secPoderes('PODERES PARANORMAIS', f.poderes_paranormais)}
        ${secRituais(f.rituais)}
        ${secInventario(f)}
        ${lista('ROLAGENS PERSONALIZADAS', rolls)}
        <h4 class="tf text-lg mt-4 mb-1 border-b border-gray-700">HISTÓRICO DE ROLAGENS</h4>
        <div class="max-h-60 overflow-y-auto">${hist.map(r => `<div class="flex justify-between border-b border-gray-800 py-1 text-xs"><span class="text-gray-500">${esc(new Date(r.data).toLocaleString('pt-BR'))}</span><span class="flex-grow px-2">${esc(r.nome)} <span class="text-gray-500">(${esc(r.formula)})</span>${r.detalhes && r.detalhes.critico ? ' <b class="tf" style="color:var(--accent)">CRÍTICO!</b>' : ''}</span><b class="tf text-base">${esc(r.total)}</b></div>`).join('') || '<p class="text-gray-500">—</p>'}</div>`);
}

function applyColor(t){const m={red:'#ef4452',blue:'#3b82f6',green:'#22c55e'};const h=m[t]||(/^#[0-9a-f]{6}$/i.test(t||'')?t:m.red);const s=document.body.style;s.setProperty('--accent',h);s.setProperty('--acc-t','color-mix(in srgb,'+h+' 55%,white)');s.setProperty('--glow','color-mix(in srgb,'+h+' 16%,transparent)');const p=document.getElementById('theme-picker');if(p)p.value=h}
function mudarCor(v){applyColor(v);setCookie('tema',v)}
// --- BOOTSTRAP ---
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalAberto()) fecharModal(); });
window.onload = () => {
    const t = getCookie('tema');
    if (t) applyColor(t);
    const u = getCookie('usuario');
    if (u) { usuario = u; $('user-name').value = u; iniciar(); }
    else setStatus('Digite seu nome e clique em ENTRAR.');
};
</script>
</body>
